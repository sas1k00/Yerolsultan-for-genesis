<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тот день</title>
<meta name="description" content="Личный дневник, который превращает день — текст, фото и песню — в воспоминание с его атмосферой.">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#/">Тот день</a>
  <nav>
    <a href="#/" data-nav="archive">Архив</a>
    <a href="#/feed" data-nav="feed">Лента</a>
    <a href="#/new" class="btn btn-ink" data-nav="new">+ Записать день</a>
  </nav>
</header>
<main id="app" aria-live="polite"></main>
<footer class="foot">
  <span>Всё хранится только в этом браузере. Без сервера, без аккаунта, без ИИ: оформление считают правила.</span>
  <a href="#/rules">Правила визуальной системы</a>
</footer>

<template id="tpl-new">
  <section class="new">
    <h1 class="hand">Как прошёл день?</h1>
    <form id="day-form" autocomplete="off">
      <label class="field">
        <span class="lbl">Дата</span>
        <input type="date" name="date" required>
      </label>
      <label class="field">
        <span class="lbl">Запись</span>
        <textarea name="text" rows="7" required minlength="20" placeholder="Расскажите, как близкому другу: погода, свет, запахи, звуки, кто был рядом, мелкие детали, которые запомнились."></textarea>
        <span class="hint" id="text-hint">Чем конкретнее, тем точнее страница. Минимум одно предложение.</span>
      </label>
      <div class="field">
        <span class="lbl">Фото дня <em>(1–6)</em></span>
        <label class="drop" id="drop">
          <input type="file" name="photos" accept="image/*" multiple hidden>
          <span>Перетащите фото сюда или <u>выберите</u></span>
        </label>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <fieldset class="field song">
        <legend class="lbl">Песня дня</legend>
        <div class="song-grid">
          <label>Ссылка <input type="url" name="link" placeholder="YouTube или Spotify"></label>
          <label>или аудиофайл <input type="file" name="audio" accept="audio/*"></label>
          <div class="moment-field"><label>Любимый момент <input name="start" placeholder="1:12" inputmode="text" autocomplete="off"
            title="С какого места включать песню. Для файла можно не указывать: система найдёт сама."></label>
            <button type="button" class="btn btn-ghost" id="pick-moment" disabled title="Добавьте ссылку YouTube или аудиофайл">Выбрать на слух</button></div>
          <label>Исполнитель <input name="artist" placeholder="Frank Sinatra"></label>
          <label>Название <input name="title" placeholder="The Way You Look Tonight"></label>
          <label>Жанр <select name="genre"></select></label>
          <label>Год <input name="year" type="number" min="1900" max="2100" placeholder="необязательно"></label>
        </div>
        <div class="yt-find"><button type="button" class="btn btn-ghost" id="yt-find" disabled title="Впишите название песни или исполнителя">Найти на YouTube по названию</button>
          <div class="yt-results" id="yt-results" hidden></div></div>
        <p class="hint song-info" id="song-info" aria-live="polite">Вставьте ссылку: название, исполнитель, год и жанр подставятся сами. Или впишите название и нажмите «Найти на YouTube».</p>
        <div class="feel" id="feel">
          <p class="feel-q"><b>Как звучит эта песня?</b> <span id="feel-why">Два касания, и песня влияет на страницу.</span></p>
          <div class="feel-row" role="radiogroup" aria-label="Энергия песни">
            <label class="tap"><input type="radio" name="energyHint" value="calm"><span>Спокойная</span></label>
            <label class="tap"><input type="radio" name="energyHint" value="energetic"><span>Энергичная</span></label>
          </div>
          <div class="feel-row" role="radiogroup" aria-label="Настроение песни">
            <label class="tap"><input type="radio" name="moodHint" value="major"><span>Светлая</span></label>
            <label class="tap"><input type="radio" name="moodHint" value="minor"><span>Грустная</span></label>
          </div>
        </div>
        <div class="chips-row">
          <span class="lbl-sm">Темп</span>
          <label class="chip"><input type="radio" name="tempoHint" value="slow"> медленная</label>
          <label class="chip"><input type="radio" name="tempoHint" value="medium"> средняя</label>
          <label class="chip"><input type="radio" name="tempoHint" value="fast"> быстрая</label>
          <label class="chip"><input type="radio" name="tempoHint" value="" checked> не знаю</label>
          <button type="button" class="btn btn-ghost" id="tap">Отстучать ритм</button>
          <span class="tap-out" id="tap-out"></span>
        </div>
        <p class="hint">С файлом темп и лад находит анализ звука. Со ссылкой песня влияет на оформление через два ответа выше, описание или отстуканный ритм. Файл остаётся только в вашей папке дня.</p>
      </fieldset>
      <label class="field inline">
        <span class="lbl">Погода <em>(по желанию)</em></span>
        <select name="weather">
          <option value="">не указывать</option><option value="sun">солнце</option><option value="rain">дождь</option>
          <option value="snow">снег</option><option value="fog">туман</option><option value="wind">ветер</option>
        </select>
      </label>
      <div class="form-error" id="form-error" role="alert"></div>
      <button class="btn btn-ink btn-big" type="submit">Собрать воспоминание</button>
    </form>
    <div class="building" id="building" hidden>
      <!-- The day "develops" like a Polaroid while it is being built. -->
      <div class="develop" id="develop" aria-hidden="true"><img id="develop-img" alt=""></div>
      <p class="hand" id="build-step">Читаю запись…</p>
      <ol id="build-log"></ol>
    </div>
  </section>
</template>

<script src="js/lexicon.js"></script>
<script src="js/text.js"></script>
<script src="js/naming.js"></script>
<script src="js/photo.js"></script>
<script src="js/music.js"></script>
<script src="js/system.js"></script>
<script src="js/render.js"></script>
<script src="js/store.js"></script>
<script src="js/voice.js"></script>
<script src="js/config.js"></script>
<script src="js/moment.js"></script>
<script src="js/songinfo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
